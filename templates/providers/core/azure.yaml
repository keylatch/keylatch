provider: azure
display_name: Microsoft Azure
category: cloud
description: "Azure access through a local managed-identity endpoint bound to the resource in the connection's mint.azure policy."
docs_url: https://learn.microsoft.com/entra/identity-platform/v2-oauth2-client-creds-grant-flow
docs:
  credentials_url: https://portal.azure.com/#view/Microsoft_AAD_RegisteredApps/ApplicationsListBlade

secret_fields:
  - name: client_secret
    label: Client secret of the application registration
    description: "Supply with -f client_secret=@- ; never on the command line."
    required: false
    sensitive: true
    secret_kind: client_secret
  - name: client_assertion
    label: Federated identity assertion
    description: "Short-lived JWT from the trusted external issuer; set mint.azure.authentication to federated. Supply through stdin, never on the command line."
    required: false
    sensitive: true
    secret_kind: bearer_token

config_fields:
  - name: tenant_id
    label: Directory (tenant) ID
    required: true
  - name: client_id
    label: Application (client) ID
    required: true

auth_flow: custom

storage_path_tpl: "{{.Namespace}}/cloud/azure/{{.Account}}"
trust_level: 2

runtime_support:
  preferred: minted
  supported:
    - minted
  runtime_reason: "The command receives an access token for one resource, named in the connection's mint.azure policy. Entra ID decides the token lifetime; a token longer than the policy's max_ttl is refused. The client secret never reaches the command."
  gateway_supported: false

minted_fields:
  - access_token
  - identity_endpoint
  - identity_header

injection_rules:
  - env_var: IDENTITY_ENDPOINT
    source: identity_endpoint
  - env_var: IDENTITY_HEADER
    source: identity_header

allowed_command_prefixes:
  - "az"
  - "terraform"
  - "tofu"
  - "python3"
  - "node"
  - "curl"

capabilities:
  - name: tokens.mint
    description: Mint an access token for one resource

deny_routes:
  - "/*/oauth2/v2.0/token"
  - "/*/oauth2/token"
