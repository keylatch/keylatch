provider: openrouter
display_name: OpenRouter
category: ai
description: "OpenRouter AI gateway — unified API for multiple LLM providers."
docs_url: https://openrouter.ai/docs

secret_fields:
  - name: api_key
    label: API Key
    required: true
    sensitive: true
    env_var: OPENROUTER_API_KEY

env_mappings:
  api_key: OPENROUTER_API_KEY

auth_flow: api_key
auth_placement:
  in: header
  name: Authorization
  scheme: Bearer

storage_path_tpl: "{{.Namespace}}/ai/openrouter/{{.Account}}"
trust_level: 0

runtime_support:
  preferred: gateway_sdk
  supported:
    - gateway_sdk
    - gateway_typed

sdk_compat:
  language: javascript
  package: openai

capabilities:
  - name: chat.completion
    description: Chat completion via OpenAI-compatible API
  - name: models.list
    description: List available models

actions:
  list-models:
    method: GET
    path: /api/v1/models

allowed_command_prefixes:
  - "node "
  - "tsx "

injection_rules:
  - env_var: OPENROUTER_API_KEY
    source: api_key

redaction:
  - pattern: 'sk-or-[A-Za-z0-9\-_]{20,}'
    replacement: "****"

test_strategy:
  kind: http_get
  endpoint: https://openrouter.ai/api/v1/models
  expect:
    status_code: 200
    markers:
      - data
