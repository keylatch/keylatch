provider: cargo
display_name: crates.io
category: packages
description: "Publish Rust crates using a host-bound registry token placeholder."
docs_url: https://doc.rust-lang.org/cargo/reference/registry-authentication.html
secret_fields:
  - name: token
    label: Scoped API Token
    required: true
    sensitive: true
    env_var: CARGO_REGISTRY_TOKEN
    secret_kind: personal_token
env_mappings:
  token: CARGO_REGISTRY_TOKEN
auth_flow: api_key
auth_placement:
  in: header
  name: Authorization
storage_path_tpl: "{{.Namespace}}/packages/cargo/{{.Account}}"
trust_level: 2
runtime_support:
  preferred: gateway_proxy
  supported: [gateway_proxy]
injection_rules:
  - env_var: CARGO_REGISTRY_TOKEN
    source: token
hosts: [crates.io, index.crates.io, static.crates.io]
slots:
  - field: token
    in: header
    name: Authorization
    hosts: [crates.io]
placeholder_shape:
  min_length: 32
env_class:
  default: prod
