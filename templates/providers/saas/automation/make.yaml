provider: make
display_name: Make
category: automation
description: "Make (formerly Integromat) automation platform API."
docs_url: https://www.make.com/en/api-documentation
docs:
  credentials_url: https://www.make.com/en/help/account/api-keys

secret_fields:
  - name: api_key
    label: API Key
    required: true
    sensitive: true
    env_var: MAKE_API_KEY
    secret_kind: api_key

env_mappings:
  api_key: MAKE_API_KEY

auth_flow: api_key
auth_placement:
  in: header
  name: Authorization
  scheme: Token

storage_path_tpl: "{{.Namespace}}/automation/make/{{.Account}}"
trust_level: 1

runtime_support:
  preferred: gateway_typed
  supported:
    - gateway_typed

capabilities:
  - name: scenarios.read
    description: List and read automation scenarios
  - name: scenarios.run
    description: Execute automation scenarios

allowed_command_prefixes:
  - "node "

injection_rules:
  - env_var: MAKE_API_KEY
    source: api_key

test_strategy:
  kind: http_get
  endpoint: https://www.make.com/api/v2/scenarios
  expect:
    status_code: 200
