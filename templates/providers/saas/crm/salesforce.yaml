provider: salesforce
display_name: Salesforce
category: crm
description: "Salesforce CRM — connected app OAuth client credentials."
docs_url: https://developer.salesforce.com/docs/apis
docs:
  credentials_url: https://developer.salesforce.com/docs/atlas.en-us.api_rest.meta/api_rest/intro_oauth_and_connected_apps.htm
  scopes_url: https://developer.salesforce.com/docs/atlas.en-us.api_rest.meta/api_rest/intro_oauth_and_connected_apps.htm

secret_fields:
  - name: client_id
    label: Consumer Key
    required: true
    sensitive: false
    env_var: SALESFORCE_CLIENT_ID
  - name: client_secret
    label: Consumer Secret
    required: true
    sensitive: true
    env_var: SALESFORCE_CLIENT_SECRET
    secret_kind: client_secret

env_mappings:
  client_id: SALESFORCE_CLIENT_ID
  client_secret: SALESFORCE_CLIENT_SECRET

auth_flow: oauth_browser

storage_path_tpl: "{{.Namespace}}/crm/salesforce/{{.Account}}"
trust_level: 3

runtime_support:
  preferred: gateway_typed
  supported:
    - gateway_typed

capabilities:
  - name: records.read
    description: Query Salesforce objects via SOQL
  - name: records.write
    description: Create and update Salesforce records

allowed_command_prefixes:
  - "node "
  - "sfdx "
  - "sf "

injection_rules:
  - env_var: SALESFORCE_CLIENT_ID
    source: client_id
  - env_var: SALESFORCE_CLIENT_SECRET
    source: client_secret

test_strategy:
  kind: http_get
  endpoint: https://login.salesforce.com/services/oauth2/userinfo
  expect:
    status_code: 200
