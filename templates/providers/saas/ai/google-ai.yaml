provider: google-ai
display_name: Google AI
category: ai
description: "Google AI Gemini models — multimodal large language models."
docs_url: https://ai.google.dev/docs
docs:
  credentials_url: https://aistudio.google.com/app/apikey

secret_fields:
  - name: api_key
    label: API Key
    required: true
    sensitive: true
    env_var: GOOGLE_AI_API_KEY
    secret_kind: api_key

env_mappings:
  api_key: GOOGLE_AI_API_KEY

auth_flow: api_key
auth_placement:
  in: query
  name: key

storage_path_tpl: "{{.Namespace}}/ai/google-ai/{{.Account}}"
trust_level: 0

runtime_support:
  preferred: gateway_typed
  supported:
    - gateway_typed
    - gateway_sdk

capabilities:
  - name: chat.completion
    description: Chat completion via Gemini models
  - name: embeddings.generate
    description: Generate text embeddings

allowed_command_prefixes:
  - "node "
  - "python3 "

injection_rules:
  - env_var: GOOGLE_AI_API_KEY
    source: api_key

redaction:
  - pattern: 'AIza[A-Za-z0-9\-_]{35}'
    replacement: "****"

test_strategy:
  kind: http_get
  endpoint: https://generativelanguage.googleapis.com/v1beta/models
  expect:
    status_code: 200
    markers:
      - models
