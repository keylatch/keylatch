provider: replicate
display_name: Replicate
category: ai
description: "Replicate model hosting and inference platform."
docs_url: https://replicate.com/docs/reference/http

secret_fields:
  - name: api_token
    label: API Token
    required: true
    sensitive: true
    env_var: REPLICATE_API_TOKEN
    secret_kind: bearer_token

env_mappings:
  api_token: REPLICATE_API_TOKEN

auth_flow: bearer
auth_placement:
  in: header
  name: Authorization
  scheme: Bearer

storage_path_tpl: "{{.Namespace}}/ai/replicate/{{.Account}}"
trust_level: 0

runtime_support:
  preferred: gateway_sdk
  supported:
    - gateway_sdk
    - direct_brokered

capabilities:
  - name: model.predict
    description: Run predictions on Replicate-hosted models

gateway_actions:
  - name: predict
    description: Create a prediction
    method: POST
    sdk_path: /v1/predictions
    upstream_path: /v1/predictions

injection_rules:
  - env_var: REPLICATE_API_TOKEN
    source: api_token

redaction:
  - pattern: 'r8_[A-Za-z0-9]{20,}'
    replacement: "****"

test_strategy:
  kind: http_get
  endpoint: https://api.replicate.com/v1/account
  expect:
    status_code: 200
