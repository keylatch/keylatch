name: keylatch-integration

on:
  push:
    branches: [main]
  pull_request:

# Secrets required:
#   OP_SERVICE_ACCOUNT_TOKEN — 1Password service account token scoped to one vault

env:
  KEYLATCH_BACKEND: op
  OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

jobs:
  keylatch-check:
    name: Run with Keylatch credentials
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Keylatch
        # Download, checksum-verify and unpack the release tarball for the
        # runner platform; see docs/verifying-releases.md.
        run: |
          echo "${HOME}/.local/bin" >> "$GITHUB_PATH"

      - name: Bootstrap Keylatch
        run: keylatch bootstrap --backend op

      - name: Connect the provider by reference
        run: |
          keylatch connect openrouter --non-interactive \
            --provider-ref api_key=op://CI/OpenRouter/api_key

      - name: Verify Keylatch setup
        run: keylatch doctor --quiet

      - name: Run script with credentials injected
        run: |
          keylatch run \
            --clean-env \
            --runtime gateway_typed \
            openrouter \
            -- python3 docs/integration/examples/python/fetch_data.py
