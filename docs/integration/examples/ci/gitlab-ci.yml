# Keylatch GitLab CI integration example
#
# CI/CD variables required (Settings -> CI/CD -> Variables):
#   OP_SERVICE_ACCOUNT_TOKEN — 1Password service account token (Masked, Protected)

variables:
  KEYLATCH_BACKEND: op

run-with-credentials:
  script:
    # Install the checksum-verified release tarball first; see docs/verifying-releases.md.
    - keylatch bootstrap --backend op
    - keylatch connect openrouter --non-interactive --provider-ref api_key=op://CI/OpenRouter/api_key
    - keylatch doctor --quiet
    - |
      keylatch run \
        --clean-env \
        --runtime gateway_typed \
        openrouter \
        -- python3 docs/integration/examples/python/fetch_data.py
