name: go-test
description: Run the Go test suite with race detection and coverage, then the crypto and canary suites.

inputs:
  require-real-clients:
    description: Set to "1" where the runner image ships git and gh, so the proxy tests that drive them must run.
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: go.mod
        cache: true
    - name: Allow unprivileged user namespaces
      # The contained runtime's tests create real namespaces; Ubuntu runners
      # restrict them with AppArmor by default.
      if: runner.os == 'Linux'
      shell: bash
      run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
    - name: Install private keyring coverage dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y dbus gnome-keyring
    - name: Run tests with coverage
      shell: bash
      env:
        KEYLATCH_BACKEND: file
        KEYLATCH_REQUIRE_REAL_CLIENTS: ${{ inputs.require-real-clients }}
      run: go test -short -coverprofile=coverage.out ./... -race -count=1 -timeout 600s
    - name: Upload coverage artifact
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: coverage-report-${{ runner.os == 'Linux' && 'ubuntu' || runner.os == 'macOS' && 'macos' || 'windows' }}-latest
        path: coverage.out
        retention-days: 7
    - name: go test crypto
      shell: bash
      run: go test -run TestCrypto -v ./internal/crypto/...
    - name: go test canary
      shell: bash
      run: go test -run TestCanary -v ./internal/canary/...
    - name: go test canary meta
      shell: bash
      run: go test -tags meta ./internal/canary/...
