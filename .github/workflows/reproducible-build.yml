name: Reproducible Build

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

jobs:
  build-1:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: SOURCE_DATE_EPOCH=0 go build -trimpath -ldflags="-s -w" -o keylatch-1 ./cmd/keylatch
      - uses: actions/upload-artifact@v4
        with:
          name: build-1-${{ matrix.os }}
          path: keylatch-1

  build-2:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: SOURCE_DATE_EPOCH=0 go build -trimpath -ldflags="-s -w" -o keylatch-2 ./cmd/keylatch
      - uses: actions/upload-artifact@v4
        with:
          name: build-2-${{ matrix.os }}
          path: keylatch-2

  compare:
    needs: [build-1, build-2]
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-1-${{ matrix.os }}
          path: b1/
      - uses: actions/download-artifact@v4
        with:
          name: build-2-${{ matrix.os }}
          path: b2/
      - name: compare ${{ matrix.os }} builds
        run: |
          sha256sum b1/keylatch-1 b2/keylatch-2
          diff b1/keylatch-1 b2/keylatch-2 \
            && echo "builds are identical (${{ matrix.os }})" \
            || { echo "FAIL: builds differ on ${{ matrix.os }}"; exit 1; }
