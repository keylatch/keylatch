name: Reproducible Build

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

concurrency:
  group: reproducible-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-1:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - run: SOURCE_DATE_EPOCH=0 go build -trimpath -ldflags="-s -w" -o keylatch-${{ matrix.os }} ./cmd/keylatch
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: keylatch-build-1-${{ matrix.os }}
          path: keylatch-${{ matrix.os }}

  build-2:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - run: SOURCE_DATE_EPOCH=0 go build -trimpath -ldflags="-s -w" -o keylatch-${{ matrix.os }} ./cmd/keylatch
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: keylatch-build-2-${{ matrix.os }}
          path: keylatch-${{ matrix.os }}

  compare:
    needs: [build-1, build-2]
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: keylatch-build-1-${{ matrix.os }}
          path: build-1/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: keylatch-build-2-${{ matrix.os }}
          path: build-2/
      - name: compare (${{ matrix.os }})
        run: |
          chmod +x build-1/keylatch-${{ matrix.os }} build-2/keylatch-${{ matrix.os }}
          sha256sum build-1/keylatch-${{ matrix.os }} build-2/keylatch-${{ matrix.os }}
          diff build-1/keylatch-${{ matrix.os }} build-2/keylatch-${{ matrix.os }} \
            && echo "builds are identical (${{ matrix.os }})" \
            || { echo "FAIL: builds differ on ${{ matrix.os }}"; exit 1; }
