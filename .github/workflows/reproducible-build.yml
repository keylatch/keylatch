name: Reproducible Build

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

jobs:
  reproducible:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build-1
        run: SOURCE_DATE_EPOCH=0 go build -trimpath -ldflags="-s -w" -o keylatch-1 ./cmd/keylatch
      - name: build-2
        run: SOURCE_DATE_EPOCH=0 go build -trimpath -ldflags="-s -w" -o keylatch-2 ./cmd/keylatch
      - name: compare (${{ matrix.os }})
        run: |
          sha256sum keylatch-1 keylatch-2
          diff keylatch-1 keylatch-2 \
            && echo "builds are identical (${{ matrix.os }})" \
            || { echo "FAIL: builds differ on ${{ matrix.os }}"; exit 1; }
