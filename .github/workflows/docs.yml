name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'docs/mint.json'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs-validate:
    name: Validate Mintlify build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Check Mintlify build
        run: npx --yes mintlify validate
        working-directory: docs
