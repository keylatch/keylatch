name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'docs/mint.json'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs-validate:
    name: Validate Mintlify build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check Mintlify build
        run: npx --yes mintlify validate
        working-directory: docs
