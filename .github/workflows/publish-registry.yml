name: Publish Registry Bundles

on:
  push:
    branches: [main]
    paths:
      - 'templates/providers/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-community-bundle:
    permissions:
      contents: read
      id-token: write # Required for keyless OIDC signing via Fulcio (default path)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: 'v2.5.0'

      - name: assemble community bundle
        run: |
          mkdir -p dist/provider-bundles
          go run ./scripts/assemble-community-bundle.go \
            --templates-dir templates/providers/community \
            --output dist/provider-bundles/community.json

      - name: sign community bundle (keyless OIDC)
        if: env.REGISTRY_COSIGN_USE_KEYED != '1'
        run: |
          cosign sign-blob --yes \
            --output-signature dist/provider-bundles/community.json.sig \
            --output-certificate dist/provider-bundles/community.json.cert \
            dist/provider-bundles/community.json
          echo "Bundle signed with keyless OIDC (Fulcio + Rekor)"

      - name: sign community bundle (keyed ECDSA-P256)
        if: env.REGISTRY_COSIGN_USE_KEYED == '1'
        env:
          REGISTRY_COSIGN_PRIVATE_KEY: ${{ secrets.REGISTRY_COSIGN_PRIVATE_KEY }}
          REGISTRY_COSIGN_PASSWORD: ${{ secrets.REGISTRY_COSIGN_PASSWORD }}
        run: |
          bash scripts/sign-provider-bundle.sh dist/provider-bundles/

      - name: verify bundle signature (keyless OIDC)
        if: env.REGISTRY_COSIGN_USE_KEYED != '1'
        run: |
          cosign verify-blob \
            --certificate dist/provider-bundles/community.json.cert \
            --signature dist/provider-bundles/community.json.sig \
            --certificate-identity-regexp="https://github.com/keylatch/keylatch/.github/workflows/publish-registry.yml@refs/heads/main" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            dist/provider-bundles/community.json
          echo "Bundle signature verified (keyless)"

      - name: verify bundle signature (keyed ECDSA-P256)
        if: env.REGISTRY_COSIGN_USE_KEYED == '1'
        run: |
          if [[ -s dist/provider-bundles/community.json.sig ]]; then
            cosign verify-blob \
              --key internal/registry/cosign.pub \
              --signature dist/provider-bundles/community.json.sig \
              dist/provider-bundles/community.json
            echo "Bundle signature verified (keyed)"
          else
            echo "::warning::Signature file empty — skipping verify (no key configured)"
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: community-bundle
          path: |
            dist/provider-bundles/community.json
            dist/provider-bundles/community.json.sig
            dist/provider-bundles/community.json.cert
          retention-days: 30
