name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch: {}

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --no-git --source=/repo --config=/repo/.gitleaks.toml --verbose

  canary-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check canary strings not leaked outside canary package
        # Exclusion rationale:
        #   canary/   — canonical source of all KEYLATCH_CANARY_* definitions
        #   release/  — internal/release/selftest.go embeds canary IDs for self-test validation
        #   sidecar/  — internal/sidecar/events/mux.go embeds one canary ID to verify IPC
        #               scrubbing; sidecar relays opaque byte streams only; see targeted scan below
        run: |
          grep -r "KEYLATCH_CANARY_" . \
            --include="*.go" \
            --exclude-dir=canary \
            --exclude-dir=release \
            --exclude-dir=sidecar \
            | grep -v "_test.go" \
            | grep -v ":[[:space:]]*//" \
          && { echo "ERROR: canary string leaked outside canary package"; exit 1; } \
          || true

  sidecar-canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: sidecar canary scan
        run: go test ./internal/sidecar/... -run TestCanary -v -count=1

  docs-leak-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: scan docs for accidentally committed tokens
        run: bash release-gates/docs-scan.sh

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: govulncheck
        run: govulncheck ./...

  integration-keychain:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: keychain integration tests
        env:
          KEYLATCH_E2E_KEYCHAIN: '1'
        run: go test ./internal/backend/keychain/... -run Integration

  integration-op:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: 1Password integration tests
        env:
          KEYLATCH_E2E_OP: '1'
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: go test ./internal/backend/op/... -run Integration

  integration-bw:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: start Vaultwarden
        run: docker compose -f docker-compose.vaultwarden.yml up -d
      - name: Bitwarden integration tests
        env:
          KEYLATCH_E2E_BW: '1'
        run: go test ./internal/backend/bw/... -run Integration

  fuzz:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: fuzz vault path
        run: go test -fuzz=FuzzCanonicalize -fuzztime=10m ./internal/vault/path/...
      - name: fuzz vault meta
        run: go test -fuzz=FuzzAADSerializer -fuzztime=10m ./internal/vault/meta/...
      - name: fuzz audit
        run: go test -fuzz=FuzzAuditLineParser -fuzztime=10m ./internal/audit
