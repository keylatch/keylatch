name: integration-examples

on:
  push:
    branches: [main]
  pull_request:

# This workflow verifies that every integration example script in
# docs/integration/examples/ is syntactically valid and exits 0 in dry-run / mock mode.
# It does NOT require a real Keylatch vault or network access.

concurrency:
  group: integration-examples-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration-examples:
    name: Smoke-test integration examples
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build keylatch binary
        run: go build -o /tmp/keylatch ./cmd/keylatch

      - name: Add keylatch to PATH
        run: echo "/tmp" >> "$GITHUB_PATH"

      - name: Smoke-test shell examples (syntax check)
        run: |
          set -euo pipefail
          echo "Checking shell examples..."
          find docs/integration/examples -name "*.sh" -exec bash -n {} \;
          echo "All shell scripts passed syntax check."

      - name: Smoke-test Python examples (syntax check)
        run: |
          set -euo pipefail
          echo "Checking Python examples..."
          find docs/integration/examples -name "*.py" | while read -r script; do
            echo "  python3 -m py_compile ${script}"
            python3 -m py_compile "${script}"
          done
          echo "All Python files passed syntax check."

      - name: Install TypeScript
        run: npm install -g typescript

      - name: Smoke-test Node examples (TypeScript syntax)
        run: |
          tsc --noEmit --module node16 --moduleResolution node16 \
            --strict false --skipLibCheck true \
            docs/integration/examples/node/node-process.d.ts \
            docs/integration/examples/node/fetchData.ts

      - name: Smoke-test Python fetch_data.py (mock mode)
        run: |
          python3 -c "
          import importlib.util, os
          os.environ['KEYLATCH_GATEWAY_URL'] = 'http://mock'
          os.environ['KEYLATCH_GATEWAY_TOKEN'] = 'mock-token'
          spec = importlib.util.spec_from_file_location('fetch_data', 'docs/integration/examples/python/fetch_data.py')
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          url, token = mod.get_gateway_vars()
          assert url == 'http://mock' and token == 'mock-token', f'Expected mock values, got {url} {token}'
          print('fetch_data.py env guard: OK')
          "

      - name: Smoke-test keylatch init integration command
        run: |
          set -euo pipefail
          TMPDIR_TEST=$(mktemp -d)
          cd "${TMPDIR_TEST}"

          # Test shell project
          keylatch init integration --agent claude-code
          test -f .keylatch/integration.yml
          test -f scripts/keylatch-setup.sh
          grep -q "agent: claude-code" .keylatch/integration.yml
          echo "init integration --agent claude-code: OK"

          # Test Python project detection
          TMPDIR_PY=$(mktemp -d)
          cd "${TMPDIR_PY}"
          touch pyproject.toml
          keylatch init integration --agent gemini
          test -f scripts/keylatch_setup.py
          echo "init integration Python detection: OK"

          # Test Node project detection
          TMPDIR_NODE=$(mktemp -d)
          cd "${TMPDIR_NODE}"
          echo '{"name":"test"}' > package.json
          keylatch init integration --agent cursor
          test -f scripts/keylatchSetup.ts
          echo "init integration Node detection: OK"

      - name: Smoke-test keylatch doctor I3 check (no markers)
        run: |
          set -euo pipefail
          TMPDIR_DOCTOR=$(mktemp -d)
          cd "${TMPDIR_DOCTOR}"

          # Bootstrap keylatch so doctor can run
          TMPDIR_KL=$(mktemp -d)
          HOME="$TMPDIR_KL" keylatch bootstrap --backend=file

          # Run doctor in JSON mode — should not fail hard on I3
          HOME="$TMPDIR_KL" keylatch doctor --json --category environment || true
          echo "doctor I3 (no markers): OK"

      - name: Smoke-test keylatch doctor I3 check (with marker)
        run: |
          set -euo pipefail
          TMPDIR_DOCTOR=$(mktemp -d)
          cd "${TMPDIR_DOCTOR}"

          # Bootstrap keylatch
          TMPDIR_KL=$(mktemp -d)
          HOME="$TMPDIR_KL" keylatch bootstrap --backend=file

          # Create a Claude Code marker
          mkdir -p .claude
          echo '{}' > .claude/settings.json

          # Doctor should warn (exit 1) but not fail hard (exit 2)
          output=$(HOME="$TMPDIR_KL" keylatch doctor --json --category environment 2>&1 || true)
          echo "${output}"
          echo "doctor I3 (with marker): OK"
