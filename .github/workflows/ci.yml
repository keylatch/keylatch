name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# CI runners have no OS keyring. Steps that bootstrap a throwaway vault run
# scripts/ci-operator-config.sh first, which writes the operator config that
# allows a plaintext vault key; no environment variable can.

# Pull requests run only the jobs whose inputs changed, and start macOS and
# Windows only after Linux passes. Pushes to main and manual runs run
# everything. Required checks are plain (non-matrix) jobs so a skipped one
# still reports under its own name.
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.full.outputs.full == 'true' || steps.code.outputs.go == 'true' }}
      web: ${{ steps.full.outputs.full == 'true' || steps.areas.outputs.web == 'true' }}
      desktop: ${{ steps.full.outputs.full == 'true' || steps.areas.outputs.desktop == 'true' }}
      guards: ${{ steps.full.outputs.full == 'true' || steps.areas.outputs.guards == 'true' }}
      docs: ${{ steps.full.outputs.full == 'true' || steps.areas.outputs.docs == 'true' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: full run
        id: full
        run: echo "full=${{ github.event_name != 'pull_request' }}" >> "$GITHUB_OUTPUT"
      # Go jobs run unless every changed file is one Go cannot read.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: code
        with:
          predicate-quantifier: every
          filters: |
            go:
              - '**'
              - '!docs/**'
              - '!**/*.md'
              - '!web/**'
              - '!src-tauri/**'
              - '!services/**'
              - '!Formula/**'
              - '!.husky/**'
              - '!LICENSE'
              - '!mise.toml'
              - '!commitlint.config.js'
              - '!package.json'
              - '!.gitignore'
              - '!.claudeignore'
              - '!.rgignore'
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: areas
        with:
          filters: |
            ci: &ci
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            web:
              - *ci
              - 'web/**'
            desktop:
              - *ci
              - 'web/**'
              - 'src-tauri/**'
              - 'cmd/keylatchd/**'
              - 'scripts/check-tauri-pubkey.go'
            guards:
              - *ci
              - 'contrib/agent-guards/**'
              - 'internal/guard/**'
            docs:
              - *ci
              - 'docs/**'
              - 'examples/**'

  vaultwarden:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    uses: ./.github/workflows/vaultwarden.yml

  secret-service:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install private keyring test dependencies
        run: sudo apt-get update && sudo apt-get install -y dbus gnome-keyring
      - name: Verify Secret Service identity storage
        run: go test -p 2 -race -count=1 -run '^TestSecretService' ./internal/crypto/kek

  lint:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: gofmt -l . | (! grep .)
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7.0.1
        with:
          version: v2.14.0
          args: --config=.golangci.yml --timeout=10m

  naming:
    # Code, docs and commit subjects describe what the code does, never the
    # internal work item or finding id behind a change.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: naming scan self-test
        run: bash release-checks/naming-scan.sh --self-test
      - name: code and file names
        run: bash release-checks/naming-scan.sh
      - name: docs
        run: bash release-checks/naming-scan.sh --docs
      - name: commit subjects
        if: github.event_name == 'pull_request'
        run: bash release-checks/naming-scan.sh --range "origin/${{ github.base_ref }}..HEAD"

  checks:
    # Fast repository checks, one runner instead of one per check.
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # env-docs: every KEYLATCH_* env var read in production Go source must
      # have an entry in docs/cli/environment.md.
      - name: lint-env-docs
        run: bash scripts/lint-env-docs.sh
      # SafeCopyButton TOKEN_REGEX must cover all provider key prefixes.
      - name: lint-safecopy-regex
        run: bash scripts/lint-safecopy-regex.sh
      # callMeta struct fields must be covered by callMetaAllowedFields.
      - name: lint-callmeta-fields
        run: bash scripts/lint-callmeta-fields.sh
      # Guard against insecure secret-in-argv examples in docs.
      - name: lint-docs-no-secrets
        run: bash scripts/lint-docs-no-secrets.sh
      # Fails if the audit salt file exists with permissions other than
      # 0600 (file) and 0700 (directory).
      - name: lint-audit-perms
        run: bash scripts/lint-audit-perms.sh
      - name: lint-no-production-todos
        run: bash scripts/lint-no-production-todos.sh
      - name: install script shellcheck
        run: shellcheck installers/install.sh installers/install.test.sh
      - name: install script test
        run: bash installers/install.test.sh
      - name: desktop IPC allowlist
        run: bash packaging/ci/lint-ipc-methods.sh
      - name: desktop notification fields
        run: bash packaging/ci/lint-notification-fields.sh
      - name: desktop secret-in-storage
        run: bash packaging/ci/scan-no-secret-in-storage.sh
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        if: needs.changes.outputs.go == 'true'
        with:
          go-version-file: go.mod
          cache: true
      - name: go mod tidy drift
        if: needs.changes.outputs.go == 'true'
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum || {
            echo "go.mod/go.sum drift detected — run 'go mod tidy' locally and commit the result"
            exit 1
          }
      - name: binary size
        if: needs.changes.outputs.go == 'true'
        run: |
          go build -ldflags="-s -w" -trimpath -o "$RUNNER_TEMP/keylatch" ./cmd/keylatch
          bash scripts/ci/check-binary-size.sh "$RUNNER_TEMP/keylatch"

  go-test-linux:
    name: go-test (ubuntu-latest)
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/go-test
        with:
          # The runner image ships git and gh: the proxy tests that drive them
          # must run there, not skip.
          require-real-clients: "1"

  coverage:
    # Floors are measured on the Linux profile so OS-specific files do not
    # move a package between runners.
    needs: [changes, go-test-linux]
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage-report-ubuntu-latest
      - name: coverage script tests
        run: bash release-checks/release-checks.test.sh
      - name: coverage floors
        run: bash release-checks/coverage-threshold.sh --report coverage.out

  linux-e2e:
    # End-to-end scripts and canaries; each builds its own binary, so they do
    # not wait for the unit tests.
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build
        run: go build -buildvcs=false -o "$RUNNER_TEMP/keylatch" ./cmd/keylatch
      - name: smoke
        run: |
          SMOKE_HOME=$(mktemp -d)
          bash scripts/ci-operator-config.sh
          # XDG_CONFIG_HOME would point keylatch at the runner's own config
          # directory instead of the throwaway home.
          kl() { env -u XDG_CONFIG_HOME KEYLATCH_ALLOW_UNSUPPORTED_BACKEND=file HOME="$SMOKE_HOME" "$RUNNER_TEMP/keylatch" "$@"; }
          kl bootstrap --backend file --dry-run --json
          kl bootstrap --backend file
          DOCTOR_DIR=$(mktemp -d)
          DOCTOR_JSON=$RUNNER_TEMP/doctor.json
          doctor_exit=0
          (cd "$DOCTOR_DIR" && kl doctor --json >"$DOCTOR_JSON") || doctor_exit=$?
          if [ "$doctor_exit" -ge 2 ]; then
            # The throwaway vault key may sit in a plaintext file on a runner
            # without a keyring; doctor reports that as a failure by design.
            unexpected=$(jq -r '[.checks[] | select(.ok == false and .name != "backend.kek") | .name] | join(",")' "$DOCTOR_JSON")
            if [ -n "$unexpected" ]; then
              cat "$DOCTOR_JSON"
              echo "doctor failed: $unexpected"
              exit "$doctor_exit"
            fi
          fi
          "$RUNNER_TEMP/keylatch" --help
      - name: validate provider templates
        run: bash release-checks/provider-template-validate.sh "$RUNNER_TEMP/keylatch"
      # Clean-machine onboarding: exit 7 → bootstrap → exit 6 → setup → exit 5|0.
      - name: bootstrap smoke
        run: bash packaging/ci/test-clean-machine-bootstrap.sh
      - name: integration (mock backend)
        run: go test -tags=integration -race -count=1 ./internal/integration/...
      - name: gateway end to end
        run: bash packaging/ci/test-gateway-end-to-end.sh
      - name: gateway canary leak scan
        run: bash packaging/ci/test-s-inv-4a-no-canary-leak.sh
      - name: external store reference roundtrip
        run: bash packaging/ci/test-external-ref-roundtrip.sh
      - name: operating modes
        env:
          KEYLATCH_BACKEND: file
          KEYLATCH_ALLOW_UNSUPPORTED_BACKEND: file
        run: bash packaging/ci/test-operating-modes.sh
      # The contained scenarios run real sandboxes; Ubuntu runners restrict
      # unprivileged user namespaces with AppArmor by default.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: install bubblewrap
        run: sudo apt-get install -y bubblewrap
      # Fake agent processes run the attacker scenario table against a built
      # keylatch binary.
      - name: run the fake agent harness
        run: go test -count=1 -timeout 20m -tags harness ./tests/harness/...

  containment:
    # Escape suite: hostile commands run in the thin-client sandbox
    # (bubblewrap) and in the daemon's own sandbox (tier D5). A host that lacks
    # a capability skips with the reason, so the job installs what it needs.
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Escape suite
        run: go test -tags containment -count=1 -timeout 900s -v ./tests/containment/...

  adapters:
    # The Postgres adapter against a real server: psql, Prisma and Node pg
    # log in with only the session token, and the server sees the stored role.
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:innovation
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: appdb
          MYSQL_USER: app_owner
          MYSQL_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ptest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: app_owner
          POSTGRES_PASSWORD: stored-database-password
          POSTGRES_DB: appdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app_owner -d appdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
      - name: Install the Postgres clients
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client redis-tools
          redis-cli -h 127.0.0.1 CONFIG SET requirepass test
          npm ci --prefix tests/adapters/prisma
          npm run generate --prefix tests/adapters/prisma
      - name: Adapter against a real server
        env:
          KEYLATCH_TEST_PG_ADDR: 127.0.0.1:5432
          KEYLATCH_TEST_PG_USER: app_owner
          KEYLATCH_TEST_PG_PASSWORD: stored-database-password
          KEYLATCH_TEST_PG_DATABASE: appdb
          KEYLATCH_TEST_REDIS_ADDR: 127.0.0.1:6379
          KEYLATCH_TEST_REDIS_PASSWORD: test
          KEYLATCH_TEST_MYSQL_ADDR: 127.0.0.1:3306
          KEYLATCH_TEST_MYSQL_PASSWORD: test
        run: |
          export KEYLATCH_TEST_NODE_PG="$GITHUB_WORKSPACE/tests/adapters/prisma/node_modules"
          go test -tags adapters -count=1 -timeout 300s -v ./internal/adapter/mysql ./tests/adapters/...

  experimental:
    # The experimental tag compiles unfinished features. They must keep
    # building and must never reach the release binary.
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build with the experimental tag
        run: go build -tags experimental ./...
      - name: test the experimental code
        run: go test -count=1 -tags experimental ./internal/team/... ./internal/trust/...
      - name: release binary has no experimental symbols
        run: go test -count=1 ./internal/release/... -run '^TestReleaseBinaryHasNoExperimentalSymbols$'

  go-test-macos:
    name: go-test (macos-latest)
    needs: [changes, go-test-linux]
    if: needs.changes.outputs.go == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/go-test
      # Run on the same runner: a macOS runner is the scarce resource.
      - name: build
        run: go build -buildvcs=false -o "$RUNNER_TEMP/keylatch" ./cmd/keylatch
      - name: smoke
        run: |
          SMOKE_HOME=$(mktemp -d)
          bash scripts/ci-operator-config.sh
          # XDG_CONFIG_HOME would point keylatch at the runner's own config
          # directory instead of the throwaway home.
          kl() { env -u XDG_CONFIG_HOME KEYLATCH_ALLOW_UNSUPPORTED_BACKEND=file HOME="$SMOKE_HOME" "$RUNNER_TEMP/keylatch" "$@"; }
          kl bootstrap --backend file --dry-run --json
          kl bootstrap --backend file
          DOCTOR_DIR=$(mktemp -d)
          DOCTOR_JSON=$RUNNER_TEMP/doctor.json
          doctor_exit=0
          (cd "$DOCTOR_DIR" && kl doctor --json >"$DOCTOR_JSON") || doctor_exit=$?
          if [ "$doctor_exit" -ge 2 ]; then
            # The throwaway vault key may sit in a plaintext file on a runner
            # without a keyring; doctor reports that as a failure by design.
            unexpected=$(jq -r '[.checks[] | select(.ok == false and .name != "backend.kek") | .name] | join(",")' "$DOCTOR_JSON")
            if [ -n "$unexpected" ]; then
              cat "$DOCTOR_JSON"
              echo "doctor failed: $unexpected"
              exit "$doctor_exit"
            fi
          fi
          "$RUNNER_TEMP/keylatch" --help
      - name: gateway end to end
        run: bash packaging/ci/test-gateway-end-to-end.sh
      - name: gateway canary leak scan
        run: bash packaging/ci/test-s-inv-4a-no-canary-leak.sh
      - name: external store reference roundtrip
        run: bash packaging/ci/test-external-ref-roundtrip.sh
      - name: run the fake agent harness
        shell: bash
        run: go test -count=1 -timeout 20m -tags harness ./tests/harness/...

  go-test-windows:
    name: go-test (windows-latest)
    needs: [changes, go-test-linux]
    if: needs.changes.outputs.go == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/go-test
      - name: integration (mock backend)
        shell: bash
        run: go test -tags=integration -race -count=1 ./internal/integration/...
      - name: run the fake agent harness
        shell: bash
        run: go test -count=1 -timeout 20m -tags harness ./tests/harness/...

  hook-test-linux:
    name: hook-test (ubuntu-latest)
    needs: changes
    if: needs.changes.outputs.guards == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: verify hook exists
        run: stat contrib/agent-guards/claude-code/block-keylatch-exfiltration.sh
      - name: run hook test
        run: bash contrib/agent-guards/claude-code/block-keylatch-exfiltration.test.sh
      - name: run other agent-guard hook tests
        run: |
          bash contrib/agent-guards/harness-contract.test.sh
          bash contrib/agent-guards/deny-corpus.test.sh
          bash contrib/agent-guards/guard-edge.test.sh
          bash contrib/agent-guards/install-scripts.test.sh
          KEYLATCH_TEST_NO_JQ=1 bash contrib/agent-guards/harness-contract.test.sh
          KEYLATCH_TEST_NO_JQ=1 bash contrib/agent-guards/deny-corpus.test.sh

  hook-test-macos:
    name: hook-test (macos-latest)
    needs: [changes, hook-test-linux]
    if: needs.changes.outputs.guards == 'true'
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: verify hook exists
        run: stat contrib/agent-guards/claude-code/block-keylatch-exfiltration.sh
      - name: run hook test
        run: bash contrib/agent-guards/claude-code/block-keylatch-exfiltration.test.sh
      - name: run other agent-guard hook tests
        run: |
          bash contrib/agent-guards/harness-contract.test.sh
          bash contrib/agent-guards/deny-corpus.test.sh
          bash contrib/agent-guards/guard-edge.test.sh
          bash contrib/agent-guards/install-scripts.test.sh
          KEYLATCH_TEST_NO_JQ=1 bash contrib/agent-guards/harness-contract.test.sh
          KEYLATCH_TEST_NO_JQ=1 bash contrib/agent-guards/deny-corpus.test.sh

  frontend:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'
          cache: true
          cache-dependency-path: web/bun.lock
      - name: bun install
        run: cd web && bun install --frozen-lockfile
      - name: type-check
        run: cd web && bun run type-check
      - name: test
        run: cd web && bun run test
      - name: build
        run: cd web && bun run build
      - name: verify bundle
        run: bash web/scripts/verify-bundle.sh

  docs-build:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'
          cache: true
          cache-dependency-path: web/bun.lock
      - name: bun install
        run: cd web && bun install --frozen-lockfile
      - name: docs build
        run: cd web && bun run docs:build

  tauri-build:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: install rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable (resolved 2026-07-05)
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri
          cache-directories: ~/.cargo/bin
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'
          cache: true
          cache-dependency-path: web/bun.lock
      - name: bun install
        run: cd web && bun install --frozen-lockfile
      - name: build web assets
        run: cd web && bun run build
      - name: build keylatchd sidecar
        run: go build -o src-tauri/binaries/keylatchd-aarch64-apple-darwin ./cmd/keylatchd
      - name: install cargo-binstall (downloads prebuilt tauri-cli, no Rust compilation)
        uses: cargo-bins/cargo-binstall@44018a4d9c280bea4bd3f908fabe5a0909f89f92 # main (resolved 2026-07-05)
      - name: install tauri-cli binary
        run: cargo binstall tauri-cli --version "^2" --no-confirm --locked
      - name: verify updater pubkey matches signing secret
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: go run scripts/check-tauri-pubkey.go
      - name: Build Tauri app
        run: cd src-tauri && cargo tauri build --no-bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
      - name: Test desktop library
        run: cargo test --release --locked --lib
        working-directory: src-tauri
      - name: Test real desktop sidecar exchange
        run: cargo test --release --locked --lib bundled_go_sidecar_bootstraps_and_rejects_old_ipc_after_restart -- --ignored
        working-directory: src-tauri

  tauri-build-windows:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'
          cache: true
          cache-dependency-path: web/bun.lock
      - name: install frontend deps
        run: bun install
        working-directory: web
      - name: build web assets
        run: bun run build
        working-directory: web
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable (resolved 2026-07-05)
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri
          # Cache ~/.cargo/bin so tauri-cli binary persists between runs
          cache-directories: ~/.cargo/bin
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build keylatchd sidecar
        run: go build -o src-tauri/binaries/keylatchd-x86_64-pc-windows-msvc.exe ./cmd/keylatchd
      - name: install cargo-binstall (downloads prebuilt tauri-cli, no Rust compilation)
        uses: cargo-bins/cargo-binstall@44018a4d9c280bea4bd3f908fabe5a0909f89f92 # main (resolved 2026-07-05)
      - name: install tauri-cli binary
        run: cargo binstall tauri-cli --version "^2" --no-confirm --locked
      - name: verify updater pubkey matches signing secret
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: go run scripts/check-tauri-pubkey.go
      - name: tauri build (no-bundle, windows)
        run: cargo tauri build --no-bundle
        working-directory: src-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Test desktop library
        run: cargo test --release --locked --lib
        working-directory: src-tauri
      - name: Test real desktop sidecar exchange
        run: cargo test --release --locked --lib bundled_go_sidecar_bootstraps_and_rejects_old_ipc_after_restart -- --ignored
        working-directory: src-tauri
