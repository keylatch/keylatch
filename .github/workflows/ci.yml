name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# CI runners have no OS keyring. Steps that bootstrap a throwaway vault run
# scripts/ci-operator-config.sh first, which writes the operator config that
# allows a plaintext vault key; no environment variable can.

jobs:
  secret-service:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install private keyring test dependencies
        run: sudo apt-get update && sudo apt-get install -y dbus gnome-keyring
      - name: Verify Secret Service identity storage
        run: go test -p 2 -race -count=1 -run '^TestSecretService' ./internal/crypto/kek

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: gofmt -l . | (! grep .)
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7.0.1
        with:
          version: v2.14.0
          args: --config=.golangci.yml --timeout=10m

  policy-lint:
    # Bundles complementary policy checks across multiple domains:
    # env-docs: every KEYLATCH_* env var read in production Go source must have an
    # entry in docs/cli/environment.md.
    # frontend-policy (safecopy-regex): SafeCopyButton TOKEN_REGEX must cover all
    # provider key prefixes.
    # frontend-policy (callmeta-fields): callMeta struct fields must be covered by
    # callMetaAllowedFields.
    # audit-perms: audit salt file must be 0600 and its directory must be 0700.
    # Fails if permissions are relaxed.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: lint-env-docs
        run: bash scripts/lint-env-docs.sh
      - name: lint-safecopy-regex
        run: bash scripts/lint-safecopy-regex.sh
      - name: lint-callmeta-fields
        run: bash scripts/lint-callmeta-fields.sh
      - name: lint-docs-no-secrets
        # Guard against insecure secret-in-argv examples in docs.
        run: bash scripts/lint-docs-no-secrets.sh
      - name: lint-audit-perms
        # Assert salt file is 0600 and directory is 0700.
        # The script skips gracefully when the salt file does not exist yet
        # (e.g. bootstrap has not been run on this CI runner). It will FAIL
        # if the salt file exists with relaxed permissions — verifying that
        # chmod 0644/0755 is caught before merge.
        run: bash scripts/lint-audit-perms.sh
      - name: lint-no-production-todos
        run: bash scripts/lint-no-production-todos.sh

  naming:
    # Code, docs and commit subjects describe what the code does, never the
    # internal work item or finding id behind a change.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: naming scan self-test
        run: bash release-checks/naming-scan.sh --self-test
      - name: code and file names
        run: bash release-checks/naming-scan.sh
      - name: docs
        run: bash release-checks/naming-scan.sh --docs
      - name: commit subjects
        if: github.event_name == 'pull_request'
        run: bash release-checks/naming-scan.sh --range "origin/${{ github.base_ref }}..HEAD"

  go-test:
    needs: lint
    strategy:
      # Report every platform's failures in one run.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Allow unprivileged user namespaces
        # The contained runtime's tests create real namespaces; Ubuntu runners
        # restrict them with AppArmor by default.
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install private keyring coverage dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y dbus gnome-keyring
      - name: Run tests with coverage
        shell: bash
        env:
          KEYLATCH_BACKEND: file
        run: go test -short -coverprofile=coverage.out ./... -race -count=1 -timeout 300s
      - name: Check coverage threshold
        # Linux runs every code path; the platform-specific packages cover
        # less on macOS and Windows by construction.
        if: runner.os == 'Linux'
        run: bash release-checks/coverage-threshold.sh coverage.out
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report-${{ matrix.os }}
          path: coverage.out
          retention-days: 7
      - name: go test crypto
        run: go test -run TestCrypto -v ./internal/crypto/...
      - name: go test canary
        run: go test -run TestCanary -v ./internal/canary/...
      - name: go test canary meta
        run: go test -tags meta ./internal/canary/...

  containment:
    # Escape suite: hostile commands run in the thin-client sandbox
    # (bubblewrap) and in the daemon's own sandbox (tier D5). A host that lacks
    # a capability skips with the reason, so the job installs what it needs.
    needs: go-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Escape suite
        run: go test -tags containment -count=1 -timeout 900s -v ./tests/containment/...

  adapters:
    # The Postgres adapter against a real server: psql and the Node pg client
    # log in with only the session token, and the server sees the stored role.
    needs: go-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: app_owner
          POSTGRES_PASSWORD: stored-database-password
          POSTGRES_DB: appdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app_owner -d appdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install the Postgres client and the Node driver
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          npm install --prefix "$RUNNER_TEMP/pgdriver" pg@8
      - name: Adapter against a real server
        env:
          KEYLATCH_TEST_PG_ADDR: 127.0.0.1:5432
          KEYLATCH_TEST_PG_USER: app_owner
          KEYLATCH_TEST_PG_PASSWORD: stored-database-password
          KEYLATCH_TEST_PG_DATABASE: appdb
        run: |
          export KEYLATCH_TEST_NODE_PG="$RUNNER_TEMP/pgdriver/node_modules"
          go test -tags adapters -count=1 -timeout 300s -v ./tests/adapters/...

  bootstrap-smoke:
    # Clean-machine smoke test for the bootstrap onboarding flow.
    # Verifies the three first-run guards (exit 7 → bootstrap → exit 6 → setup → exit 5|0).
    # Runs on ubuntu-latest only; macOS behaviour is covered by go-test matrix.
    needs: go-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: bootstrap smoke test
        run: bash packaging/ci/test-clean-machine-bootstrap.sh

  harness:
    # Fake agent processes run the attacker scenario table against a built
    # keylatch binary on every supported OS.
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Allow unprivileged user namespaces
        # The contained scenarios run real sandboxes; Ubuntu runners restrict
        # unprivileged user namespaces with AppArmor by default.
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: install bubblewrap
        if: runner.os == 'Linux'
        run: sudo apt-get install -y bubblewrap
      - name: run the fake agent harness
        shell: bash
        run: go test -count=1 -timeout 20m -tags harness ./tests/harness/...

  experimental:
    # The experimental tag compiles unfinished features. They must keep
    # building and must never reach the release binary.
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build with the experimental tag
        run: go build -tags experimental ./...
      - name: test the experimental code
        run: go test -count=1 -tags experimental ./internal/team/... ./internal/trust/...
      - name: release binary has no experimental symbols
        run: go test -count=1 ./internal/release/... -run '^TestReleaseBinaryHasNoExperimentalSymbols$'

  go-mod-tidy:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go mod tidy
        run: go mod tidy
      - name: check drift
        run: |
          git diff --exit-code go.mod go.sum || {
            echo "go.mod/go.sum drift detected — run 'go mod tidy' locally and commit the result"
            exit 1
          }

  frontend:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'
          cache: true
          cache-dependency-path: web/bun.lock
      - name: bun install
        run: cd web && bun install --frozen-lockfile
      - name: type-check
        run: cd web && bun run type-check
      - name: test
        run: cd web && bun run test
      - name: build
        run: cd web && bun run build
      - name: verify bundle
        run: bash web/scripts/verify-bundle.sh

  desktop-lint:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: IPC allowlist
        run: bash packaging/ci/lint-ipc-methods.sh
      - name: notification fields
        run: bash packaging/ci/lint-notification-fields.sh
      - name: secret-in-storage
        run: bash packaging/ci/scan-no-secret-in-storage.sh

  tauri-build:
    needs: desktop-lint
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: install rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable (resolved 2026-07-05)
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri
          cache-directories: ~/.cargo/bin
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'
          cache: true
          cache-dependency-path: web/bun.lock
      - name: bun install
        run: cd web && bun install --frozen-lockfile
      - name: build web assets
        run: cd web && bun run build
      - name: build keylatchd sidecar
        run: go build -o src-tauri/binaries/keylatchd-aarch64-apple-darwin ./cmd/keylatchd
      - name: install cargo-binstall (downloads prebuilt tauri-cli, no Rust compilation)
        uses: cargo-bins/cargo-binstall@44018a4d9c280bea4bd3f908fabe5a0909f89f92 # main (resolved 2026-07-05)
      - name: install tauri-cli binary
        run: cargo binstall tauri-cli --version "^2" --no-confirm --locked
      - name: verify updater pubkey matches signing secret
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: go run scripts/check-tauri-pubkey.go
      - name: Build Tauri app
        run: cd src-tauri && cargo tauri build --no-bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
      - name: Test desktop library
        run: cargo test --release --locked --lib
        working-directory: src-tauri

  tauri-build-windows:
    needs: desktop-lint
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'
          cache: true
          cache-dependency-path: web/bun.lock
      - name: install frontend deps
        run: bun install
        working-directory: web
      - name: build web assets
        run: bun run build
        working-directory: web
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable (resolved 2026-07-05)
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri
          # Cache ~/.cargo/bin so tauri-cli binary persists between runs
          cache-directories: ~/.cargo/bin
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build keylatchd sidecar
        run: go build -o src-tauri/binaries/keylatchd-x86_64-pc-windows-msvc.exe ./cmd/keylatchd
      - name: install cargo-binstall (downloads prebuilt tauri-cli, no Rust compilation)
        uses: cargo-bins/cargo-binstall@44018a4d9c280bea4bd3f908fabe5a0909f89f92 # main (resolved 2026-07-05)
      - name: install tauri-cli binary
        run: cargo binstall tauri-cli --version "^2" --no-confirm --locked
      - name: verify updater pubkey matches signing secret
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: go run scripts/check-tauri-pubkey.go
      - name: tauri build (no-bundle, windows)
        run: cargo tauri build --no-bundle
        working-directory: src-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Test desktop library
        run: cargo test --release --locked --lib
        working-directory: src-tauri

  hook-test:
    needs: lint
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: verify hook exists
        run: stat contrib/agent-guards/claude-code/block-keylatch-exfiltration.sh
      - name: run hook test
        run: bash contrib/agent-guards/claude-code/block-keylatch-exfiltration.test.sh
      - name: run other agent-guard hook tests
        run: |
          bash contrib/agent-guards/harness-contract.test.sh
          bash contrib/agent-guards/deny-corpus.test.sh
          bash contrib/agent-guards/guard-edge.test.sh
          bash contrib/agent-guards/install-scripts.test.sh
          KEYLATCH_TEST_NO_JQ=1 bash contrib/agent-guards/harness-contract.test.sh
          KEYLATCH_TEST_NO_JQ=1 bash contrib/agent-guards/deny-corpus.test.sh

  smoke:
    needs: lint
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build
        run: go build -o $RUNNER_TEMP/keylatch ./cmd/keylatch
      - name: smoke
        run: |
          SMOKE_HOME=$(mktemp -d)
          bash scripts/ci-operator-config.sh
          # XDG_CONFIG_HOME would point keylatch at the runner's own config
          # directory instead of the throwaway home.
          kl() { env -u XDG_CONFIG_HOME HOME=$SMOKE_HOME $RUNNER_TEMP/keylatch "$@"; }
          kl bootstrap --dry-run --json
          kl bootstrap
          DOCTOR_DIR=$(mktemp -d)
          DOCTOR_JSON=$RUNNER_TEMP/doctor.json
          doctor_exit=0
          (cd "$DOCTOR_DIR" && kl doctor --json >"$DOCTOR_JSON") || doctor_exit=$?
          if [ "$doctor_exit" -ge 2 ]; then
            # The throwaway vault key may sit in a plaintext file on a runner
            # without a keyring; doctor reports that as a failure by design.
            unexpected=$(jq -r '[.checks[] | select(.ok == false and .name != "backend.kek") | .name] | join(",")' "$DOCTOR_JSON")
            if [ -n "$unexpected" ]; then
              cat "$DOCTOR_JSON"
              echo "doctor failed: $unexpected"
              exit "$doctor_exit"
            fi
          fi
          $RUNNER_TEMP/keylatch --help

  binary-size:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build stripped
        run: go build -ldflags="-s -w" -trimpath -o $RUNNER_TEMP/keylatch ./cmd/keylatch
      - name: check size
        run: bash scripts/ci/check-binary-size.sh $RUNNER_TEMP/keylatch

  integration:
    name: Integration (mock backend)
    needs: [lint, go-test]
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run integration tests
        shell: bash
        run: go test -tags=integration -race -count=1 ./internal/integration/...

  validate-provider-templates:
    name: Validate provider templates
    needs: [lint, go-test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build keylatch binary
        run: go build -buildvcs=false -o $RUNNER_TEMP/keylatch ./cmd/keylatch
      - name: Validate provider YAML templates
        run: bash release-checks/provider-template-validate.sh $RUNNER_TEMP/keylatch

  gateway-e2e:
    name: Gateway E2E
    needs: [lint, go-test]
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run gateway E2E tests
        run: bash packaging/ci/test-gateway-end-to-end.sh
      - name: canary leak scan
        run: bash packaging/ci/test-s-inv-4a-no-canary-leak.sh
      - name: External store reference roundtrip
        run: bash packaging/ci/test-external-ref-roundtrip.sh

  operating-modes:
    name: Operating Modes
    needs: [lint, go-test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run operating-mode integration tests
        env:
          KEYLATCH_BACKEND: file
        run: bash packaging/ci/test-operating-modes.sh

  docs-build:
    # Path-conditional: only runs when docs/ or examples/ change.
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        id: filter
        with:
          filters: |
            docs:
              - 'docs/**'
              - 'examples/**'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.filter.outputs.docs == 'true' || github.event_name == 'push'
        with:
          bun-version: '1.3.14'
          cache: true
          cache-dependency-path: web/bun.lock
      - name: bun install
        if: steps.filter.outputs.docs == 'true' || github.event_name == 'push'
        run: cd web && bun install --frozen-lockfile
      - name: docs build
        if: steps.filter.outputs.docs == 'true' || github.event_name == 'push'
        run: cd web && bun run docs:build
