name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: write
  packages: write
  id-token: write
  issues: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag format
        run: echo "${{ github.ref_name }}" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$'

  test:
    needs: validate-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run tests with coverage
        env:
          KEYLATCH_BACKEND: file
        run: go test -coverprofile=coverage.out ./... -race -count=1 -timeout 120s
      - name: Check coverage threshold
        run: bash release-gates/coverage-threshold.sh coverage.out
      - run: bash contrib/agent-guards/claude-code/block-keylatch-exfiltration.test.sh

  build-cli:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.compute-hashes.outputs.hashes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
          cache: true
          cache-dependency-path: web/bun.lock
      - uses: docker/setup-buildx-action@v3
      - name: log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          AUR_KEY: ${{ secrets.AUR_KEY }}
      - name: compute artifact hashes for SLSA provenance
        id: compute-hashes
        run: |
          set -euo pipefail
          sha256sum dist/*.tar.gz dist/*.zip dist/*_checksums.txt 2>/dev/null | \
            base64 -w0 > /tmp/hashes.b64
          echo "hashes=$(cat /tmp/hashes.b64)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  sbom:
    needs: build-cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: install syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin
      - name: generate SBOM (CycloneDX + SPDX)
        run: |
          mkdir -p dist/sbom
          syft scan dir:. \
            --output cyclonedx-json=dist/sbom/keylatch-${{ github.ref_name }}.cdx.json \
            --output spdx-json=dist/sbom/keylatch-${{ github.ref_name }}.spdx.json
      - name: verify SBOM via release gate
        run: bash release-gates/sbom-verify.sh dist/sbom/keylatch-${{ github.ref_name }}.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: dist/sbom/

  release-gates:
    needs: build-cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: build gate binary
        run: go build -o /tmp/keylatch-gate ./cmd/keylatch
      - name: docs scan
        run: bash release-gates/docs-scan.sh
      - name: provider template validate
        run: bash release-gates/provider-template-validate.sh /tmp/keylatch-gate
      - name: default state regression
        run: bash release-gates/default-state-regression.sh /tmp/keylatch-gate
      - name: artifact scan
        run: bash release-gates/artifact-scan.sh dist/
      - name: binary smoke
        run: bash release-gates/binary-smoke.sh /tmp/keylatch-gate
      - name: validate updater pubkey
        run: |
          ACTIVE=$(jq -r '.plugins.updater.active // .app.updater.active // false' src-tauri/tauri.conf.json 2>/dev/null || echo false)
          PUBKEY=$(jq -r '.plugins.updater.pubkey // .app.updater.pubkey // ""' src-tauri/tauri.conf.json 2>/dev/null || echo "")
          if [ "$ACTIVE" = "true" ] && [ -z "$PUBKEY" ]; then
            echo "ERROR: updater.active is true but updater.pubkey is empty — set pubkey before enabling auto-update"
            exit 1
          fi
          echo "updater pubkey check passed (active=$ACTIVE)"

  provenance:
    needs: build-cli
    permissions:
      id-token: write
      contents: write
      actions: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    with:
      base64-subjects: "${{ needs.build-cli.outputs.hashes }}"
      provenance-name: keylatch-${{ github.ref_name }}-provenance.intoto.jsonl
      upload-assets: false

  cosign-sign:
    needs: [build-cli, sbom]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: sbom
          path: dist/sbom/
      - uses: sigstore/cosign-installer@v3
      - name: sign binaries
        run: |
          for f in dist/*.tar.gz dist/*.zip dist/*_checksums.txt; do
            [ -f "$f" ] || continue
            cosign sign-blob --yes \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.pem" \
              "${f}"
          done
      - name: sign SBOM
        run: |
          cosign sign-blob --yes \
            --output-signature dist/sbom/keylatch-${{ github.ref_name }}.cdx.json.sig \
            --output-certificate dist/sbom/keylatch-${{ github.ref_name }}.cdx.json.pem \
            dist/sbom/keylatch-${{ github.ref_name }}.cdx.json
      - name: verify signatures
        run: bash release-gates/cosign-verify.sh ${{ github.ref_name }} dist/
      - uses: actions/upload-artifact@v4
        with:
          name: signatures
          path: |
            dist/**/*.sig
            dist/**/*.pem

  container-supply-chain:
    # Container-image counterpart to the `sbom` + `cosign-sign` jobs above,
    # which only cover the CLI archives/blobs. goreleaser's `build-cli` job
    # already builds and pushes the multi-arch images + manifest list
    # (see .goreleaser.yml `dockers` / `docker_manifests`); this job scans,
    # signs, and attests the pushed OCI image itself.
    needs: [build-cli]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: sigstore/cosign-installer@v3
      - name: log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: resolve image reference
        id: image
        run: |
          # goreleaser's {{ .Version }} template strips the leading 'v' —
          # mirror that here (same pattern used by desktop-bundles job above).
          version="${GITHUB_REF_NAME#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: install trivy
        run: |
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin
      - name: install syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin
      - name: trivy scan (linux/amd64)
        run: |
          # Trivy needs a resolvable single-arch image, so this scans the
          # concrete per-arch tags rather than the manifest-list digest below.
          trivy image --platform linux/amd64 --severity CRITICAL,HIGH \
            --ignore-unfixed --exit-code 1 \
            "ghcr.io/keylatch/keylatch:${{ steps.image.outputs.version }}-amd64"
      - name: trivy scan (linux/arm64)
        run: |
          trivy image --platform linux/arm64 --severity CRITICAL,HIGH \
            --ignore-unfixed --exit-code 1 \
            "ghcr.io/keylatch/keylatch:${{ steps.image.outputs.version }}-arm64"
      - name: resolve manifest-list digests
        # Users `docker pull` the multi-arch manifest-list tags (:{version} and
        # :latest), not the per-arch tags scanned above — so signing/attesting
        # must target the manifest-list digest for `cosign verify` on those
        # tags to succeed. `docker buildx imagetools inspect` (no --raw)
        # prints the manifest list's own "Digest:" line.
        id: digest
        run: |
          set -euo pipefail
          version_tag="ghcr.io/keylatch/keylatch:${{ steps.image.outputs.version }}"
          latest_tag="ghcr.io/keylatch/keylatch:latest"
          version_digest=$(docker buildx imagetools inspect "$version_tag" | awk '/^Digest:/{print $2; exit}')
          latest_digest=$(docker buildx imagetools inspect "$latest_tag" | awk '/^Digest:/{print $2; exit}')
          if [ -z "$version_digest" ] || [ -z "$latest_digest" ]; then
            echo "::error::failed to resolve manifest-list digest for ${version_tag} or ${latest_tag}"
            exit 1
          fi
          echo "version_digest=${version_digest}" >> "$GITHUB_OUTPUT"
          echo "latest_digest=${latest_digest}" >> "$GITHUB_OUTPUT"
          # :{version} and :latest reference the same per-arch manifests within
          # a release, so they normally share one digest — dedupe so we don't
          # sign/attest the identical digest twice.
          digests="${version_digest}"
          if [ "${latest_digest}" != "${version_digest}" ]; then
            digests="${digests} ${latest_digest}"
          fi
          echo "digests=${digests}" >> "$GITHUB_OUTPUT"
      - name: sign container manifest-list (keyless OIDC)
        run: |
          set -euo pipefail
          for d in ${{ steps.digest.outputs.digests }}; do
            cosign sign --yes "ghcr.io/keylatch/keylatch@${d}"
          done
      - name: generate image SBOM (manifest-list digest)
        run: |
          set -euo pipefail
          mkdir -p dist/sbom
          for d in ${{ steps.digest.outputs.digests }}; do
            short="${d#sha256:}"
            syft scan "ghcr.io/keylatch/keylatch@${d}" \
              --output cyclonedx-json=dist/sbom/keylatch-image-${{ github.ref_name }}-${short:0:12}.cdx.json
          done
      - name: attest image SBOM (manifest-list digest)
        run: |
          set -euo pipefail
          for d in ${{ steps.digest.outputs.digests }}; do
            short="${d#sha256:}"
            cosign attest --yes \
              --predicate "dist/sbom/keylatch-image-${{ github.ref_name }}-${short:0:12}.cdx.json" \
              --type cyclonedx \
              "ghcr.io/keylatch/keylatch@${d}"
          done
      - name: verify manifest-list signature (as pulled by tag)
        run: |
          set -euo pipefail
          for ref in "ghcr.io/keylatch/keylatch:${{ steps.image.outputs.version }}" "ghcr.io/keylatch/keylatch:latest"; do
            cosign verify \
              --certificate-identity-regexp="^https://github\.com/keylatch/keylatch/\.github/workflows/release\.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$" \
              --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
              "${ref}"
          done
      - name: verify manifest-list attestation (as pulled by tag)
        run: |
          set -euo pipefail
          for ref in "ghcr.io/keylatch/keylatch:${{ steps.image.outputs.version }}" "ghcr.io/keylatch/keylatch:latest"; do
            cosign verify-attestation \
              --type cyclonedx \
              --certificate-identity-regexp="^https://github\.com/keylatch/keylatch/\.github/workflows/release\.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$" \
              --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
              "${ref}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: image-sbom
          path: dist/sbom/keylatch-image-*.json

  manifest:
    needs: [build-cli, sbom, cosign-sign]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: sbom
          path: dist/sbom/
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: generate release manifest
        run: |
          mkdir -p dist/release-manifest
          ARGS=(
            --version=${{ github.ref_name }}
            --output=dist/release-manifest/keylatch-${{ github.ref_name }}.json
          )
          for f in dist/*.tar.gz dist/*.zip; do
            [ -f "$f" ] || continue
            sha=$(sha256sum "$f" | awk '{print $1}')
            base=$(basename "$f" | sed 's/\.tar\.gz$//' | sed 's/\.zip$//')
            # keylatch_0.9.2_linux_amd64 → linux-amd64
            platform=$(echo "$base" | rev | cut -d_ -f2 | rev)
            arch=$(echo "$base" | rev | cut -d_ -f1 | rev)
            ARGS+=(--artifact="${platform}-${arch}:${f}:${sha}")
          done
          go run ./packaging/release-manifest/generate.go "${ARGS[@]}"
      - uses: sigstore/cosign-installer@v3
      - name: sign manifest
        run: |
          cosign sign-blob --yes \
            --output-signature dist/release-manifest/keylatch-${{ github.ref_name }}.json.sig \
            dist/release-manifest/keylatch-${{ github.ref_name }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: manifest
          path: dist/release-manifest/

  desktop-bundles:
    needs: [build-cli]
    strategy:
      fail-fast: false
      matrix:
        # MVP ships the Linux desktop bundle only (AppImage/.deb — no paid
        # signing certificate required). The macOS .dmg and Windows .exe desktop
        # apps are deferred to keep release costs down; their Tauri build code
        # stays in the repo. To re-enable them post-MVP, set the repo variable
        # DESKTOP_OS_MATRIX to '["macos-14","ubuntu-latest","windows-latest"]'
        # in repo settings — no code change required.
        os: ${{ fromJSON(vars.DESKTOP_OS_MATRIX || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    outputs:
      windows_failed: ${{ steps.set_windows_failed.outputs.windows_failed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
          cache: true
          cache-dependency-path: web/bun.lock
      - name: build web
        run: cd web && bun install && bun run build
      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-directories: ~/.cargo/bin
      - name: install cargo-binstall
        uses: cargo-bins/cargo-binstall@main
      - name: install tauri-cli
        run: cargo binstall tauri-cli --version "^2" --no-confirm --locked

      - name: stamp desktop bundle version from release tag
        shell: bash
        run: |
          # Single source of truth = the git tag. Tauri reads the bundle
          # version from tauri.conf.json, which is otherwise a dev placeholder
          # and would mislabel every installer (e.g. a 0.9.3 release shipping
          # 0.9.2 .dmg/.exe/.AppImage). Mirror the goreleaser `--version` flag.
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Stamping desktop bundles with version: $VERSION"
          tmp=$(mktemp)
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > "$tmp" && mv "$tmp" src-tauri/tauri.conf.json
          echo "tauri.conf.json version is now: $(jq -r '.version' src-tauri/tauri.conf.json)"

      - name: prepare keylatchd sidecar (macOS)
        if: runner.os == 'macOS'
        run: |
          GOOS=darwin GOARCH=arm64 go build -o src-tauri/binaries/keylatchd-aarch64-apple-darwin ./cmd/keylatchd
          GOOS=darwin GOARCH=amd64 go build -o src-tauri/binaries/keylatchd-x86_64-apple-darwin ./cmd/keylatchd
      - name: prepare keylatchd sidecar (Linux amd64)
        if: runner.os == 'Linux'
        run: go build -o src-tauri/binaries/keylatchd-x86_64-unknown-linux-gnu ./cmd/keylatchd
      - name: prepare keylatchd sidecar (Windows amd64)
        if: runner.os == 'Windows'
        run: go build -o src-tauri/binaries/keylatchd-x86_64-pc-windows-msvc.exe ./cmd/keylatchd

      - name: build Tauri bundle (macOS — signed)
        id: build_macos
        if: runner.os == 'macOS'
        run: |
          # Unset signing env vars when the cert is not provisioned so that
          # Tauri skips `security import` entirely rather than failing on an
          # empty value — this still produces an unsigned .dmg.
          if [ -z "$APPLE_CERTIFICATE" ]; then
            unset APPLE_CERTIFICATE
            unset APPLE_CERTIFICATE_PASSWORD
          fi
          cd src-tauri && cargo tauri build
        continue-on-error: true  # non-fatal until APPLE_CERTIFICATE is provisioned
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: warn if macOS build skipped
        if: ${{ runner.os == 'macOS' && (steps.build_macos.outcome == 'failure' || steps.build_macos.outcome == 'skipped') }}
        run: echo "::warning::macOS bundle build failed — APPLE_CERTIFICATE secrets may not be provisioned yet"

      - name: notarize macOS .dmg
        id: notarize
        if: runner.os == 'macOS'
        run: |
          DMG=$(find src-tauri/target/release/bundle/dmg -name "*.dmg" | head -1)
          [ -n "$DMG" ] || exit 0
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG"
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        continue-on-error: true  # non-fatal until certs are provisioned

      - name: warn if notarization skipped
        if: ${{ steps.notarize.outcome == 'failure' || steps.notarize.outcome == 'skipped' }}
        run: echo "::warning::Notarization skipped or failed — APPLE_ID secrets may not be provisioned yet"

      - name: build Tauri bundle (Windows — unsigned for 1.0.0)
        id: build_windows
        if: runner.os == 'Windows'
        run: cd src-tauri && cargo tauri build
        continue-on-error: true  # unsigned; EV cert deferred to 1.1.0
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: warn if Windows build skipped
        if: ${{ runner.os == 'Windows' && (steps.build_windows.outcome == 'failure' || steps.build_windows.outcome == 'skipped') }}
        run: echo "::warning::Windows bundle build failed — WINDOWS_CERTIFICATE secrets may not be provisioned yet"

      - name: set windows_failed output
        id: set_windows_failed
        if: ${{ runner.os == 'Windows' && (steps.build_windows.outcome == 'failure' || steps.build_windows.outcome == 'skipped') }}
        run: echo "windows_failed=true" >> "$GITHUB_OUTPUT"

      - name: install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: build Tauri bundle (Linux)
        if: runner.os == 'Linux'
        run: cd src-tauri && cargo tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: src-tauri/target/release/bundle/
          if-no-files-found: warn
      - name: upload macOS .dmg artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-dmg-${{ github.ref_name }}
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: warn

  publish:
    needs: [build-cli, sbom, release-gates, cosign-sign, manifest, desktop-bundles, provenance, container-supply-chain]
    runs-on: ubuntu-latest
    steps:
      - name: assert at least one desktop bundle succeeded
        if: always()
        run: |
          DESKTOP="${{ needs.desktop-bundles.result }}"
          if [[ "$DESKTOP" == "failure" ]]; then
            echo "::error::All desktop bundle builds failed - release blocked"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: all-artifacts/
      - name: collect release artifacts
        run: |
          mkdir -p release-files
          find all-artifacts -type f \( \
            -name "keylatch_*.tar.gz" \
            -o -name "keylatch_*.zip" \
            -o -name "*_checksums.txt" \
            -o -name "*.dmg" \
            -o -name "*-setup.exe" \
            -o -name "*.AppImage" -o -name "*.deb" \
            -o -name "*.cdx.json" -o -name "*.spdx.json" \
            -o -name "*.sig" -o -name "*.pem" \
            -o -name "*.intoto.jsonl" \
            -o -name "keylatch-*.json" \
          \) -exec cp {} release-files/ \;
          echo "--- collected ---" && ls -1 release-files/
      - uses: sigstore/cosign-installer@v3
      - name: cosign-sign desktop installers
        # The CLI archives are cosigned in the cosign-sign job, but the desktop
        # bundles are built in a separate job and never pass through it. Sign
        # them here — keyless OIDC, no secrets — so every shipped artifact has a
        # verifiable Sigstore signature. (Native code-signing still pending certs.)
        run: |
          shopt -s nullglob
          signed=0
          for f in release-files/*.dmg release-files/*-setup.exe release-files/*.AppImage release-files/*.deb; do
            [ -e "$f" ] || continue
            echo "Signing $f"
            cosign sign-blob --yes \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.pem" \
              "$f"
            signed=$((signed + 1))
          done
          echo "Cosigned $signed desktop installer(s)."
      - name: verify desktop installer signatures
        run: |
          shopt -s nullglob
          for f in release-files/*.dmg release-files/*-setup.exe release-files/*.AppImage release-files/*.deb; do
            [ -e "$f" ] || continue
            echo "Verifying $f"
            cosign verify-blob \
              --certificate-identity-regexp="^https://github\.com/keylatch/keylatch/\.github/workflows/release\.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$" \
              --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
              --certificate "${f}.pem" \
              --signature "${f}.sig" \
              "$f"
          done
          echo "All desktop installer signatures verified."
      - name: attach artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          fail_on_unmatched_files: false
          # Hyphenated tags (alpha/beta/rc) are prereleases and must not become
          # the "Latest" download. A clean tag (v0.9.3) ships as Latest — the
          # default grab for external testers.
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: windows bundle status
        if: needs.desktop-bundles.outputs.windows_failed == 'true'
        run: |
          echo "::warning::Windows bundle build failed — Windows artifacts not included in this release"
  release-checklist:
    needs: publish
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: create release checklist issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create release --color 0075ca --force 2>/dev/null || true
          gh label create checklist --color e4e669 --force 2>/dev/null || true
          BODY=$(sed "s/{{VERSION}}/${{ github.ref_name }}/g" .github/release-checklist-template.md)
          gh issue create \
            --title "Release checklist - ${{ github.ref_name }}" \
            --body "$BODY" \
            --label "release,checklist"
