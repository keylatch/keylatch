name: Sandbox Linux

# Runs bwrap-backed direct_classic_sandboxed tests on ubuntu-latest.
# These tests require bubblewrap which is not available on macOS runners.
# Cross-reference: internal/sandbox/driver_linux.go, internal/runner/driver_classic_sandboxed.go

on:
  pull_request:
    branches: [main]
    paths:
      - 'internal/sandbox/**'
      - 'internal/runner/driver_classic_sandboxed*.go'
      - '.github/workflows/sandbox-linux.yml'
  push:
    branches: [main]
    paths:
      - 'internal/sandbox/**'
      - 'internal/runner/driver_classic_sandboxed*.go'
      - '.github/workflows/sandbox-linux.yml'

concurrency:
  group: sandbox-linux-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# CI runners have no OS keyring; vaults created here keep a plaintext KEK.
env:
  KEYLATCH_INSECURE_FILE_KEK: "1"

jobs:
  sandbox-linux:
    name: Sandbox tests (bwrap)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install bubblewrap
        run: sudo apt-get install -y bubblewrap

      - name: Verify bwrap
        run: bwrap --version

      - name: Run sandbox and driver tests
        run: |
          go test ./internal/sandbox/... ./internal/runner/... \
            -run "TestClassicSandboxed|TestDirectClassicSandboxed|TestHashExecutable" \
            -v -count=1 -timeout=120s
